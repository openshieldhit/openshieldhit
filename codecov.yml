codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "0...100"
  status:
    project:
      default:
        target: 50%
        threshold: 5%
    patch:
      default:
        target: 0%
        threshold: 100%

# Vendored upstream source: not ours to test, and large enough to dominate any
# report it appears in.  The Codecov-side twin of the lcov --remove in
# .github/workflows/codecov.yml, so a report stays clean even if a future
# coverage job forgets the lcov filter.  Matches the src/thirdparty exclusions
# in the clang-format and clang-tidy workflows.
ignore:
  - "src/thirdparty/**"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
