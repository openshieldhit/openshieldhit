codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "0...100"
  status:
    project:
      default:
        target: 20%
        threshold: 5%
    patch:
      default:
        target: 0%
        threshold: 100%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
