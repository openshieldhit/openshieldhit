name: Codecov

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        lfs: false

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2.2.0

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y lcov

    - name: Configure project
      run: >
        cmake -S . -B build-coverage
        -DCMAKE_BUILD_TYPE=Debug
        -DOSH_BUILD_EXAMPLES=OFF
        -DOSH_ENABLE_COVERAGE=ON

    - name: Build project
      run: cmake --build build-coverage --parallel

    - name: Run tests
      # The DICOM fixtures are downloaded on demand here by ctest (the
      # DICOM_FIXTURES setup fixture runs before the DICOM tests), not at
      # configure/build time.
      run: ctest --test-dir build-coverage --output-on-failure

    - name: Capture coverage
      # src/thirdparty/* is vendored upstream source this project does not own
      # and does not test: the MCPL core alone is ~6.3k lines, most of it
      # reader/merge/CLI paths openshieldhit never calls, so leaving it in
      # swamps the report (it single-handedly dragged PR #329's patch coverage
      # to 21%).  Excluded here the same way the clang-format and clang-tidy
      # workflows already exclude it, and again in codecov.yml as a backstop.
      run: |
        lcov --capture \
          --directory build-coverage \
          --output-file coverage.info
        lcov --ignore-errors unused --remove coverage.info \
          '/usr/*' \
          '*/tests/*' \
          '*/examples/*' \
          '*/generated/*' \
          '*/src/thirdparty/*' \
          --output-file coverage.info
        lcov --list coverage.info

    - name: Upload coverage to Codecov
      if: ${{ github.actor != 'dependabot[bot]' }}
      uses: codecov/codecov-action@v7
      with:
        use_oidc: true
        files: coverage.info
        flags: unit
        fail_ci_if_error: true
        disable_search: true
        verbose: true
