name: clang-tidy

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2.2.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev clang-tidy-19 clang-tools-19

      - name: Check clang-tidy version
        run: clang-tidy-19 --version

      - name: Configure project
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DOSH_BUILD_EXAMPLES=ON

      - name: Run clang-tidy on changed lines
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No valid diff base found; skipping clang-tidy."
            exit 0
          fi

          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Diff base ${BASE} is not available in this checkout; skipping clang-tidy."
            exit 0
          fi

          git diff --diff-filter=AMRT -U0 "$BASE" "$HEAD" -- src examples tests \
            | clang-tidy-diff-19.py -p1 -path build -quiet
