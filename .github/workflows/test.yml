name: CMake CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            build_examples: ON
          - os: windows-latest
            build_examples: OFF
          - os: macos-latest
            build_examples: ON

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Full git history needed for version extraction (git describe)
        lfs: false

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2.2.0

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install sdl2

    - name: Configure project
      run: cmake -S . -B build -DOSH_BUILD_EXAMPLES=${{ matrix.build_examples }}

    - name: Build project
      run: cmake --build build --parallel --config Debug

    - name: Run tests
      run: ctest --test-dir build --output-on-failure -C Debug -E 'cases::05_dicom_simple|unit::test_osh_dicom|unit::test_osh_geometry_dcm'

    - name: Print version information (Linux/macOS)
      if: runner.os != 'Windows'
      run: ./build/bin/openshieldhit --version

    - name: Print version information (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./build/bin/Debug/openshieldhit.exe --version

    - name: Print host resources (Linux/macOS)
      if: runner.os != 'Windows'
      run: ./build/bin/openshieldhit --print-resources

    - name: Print host resources (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./build/bin/Debug/openshieldhit.exe --print-resources

  # Windows Release build — catches MSVC warnings-as-errors that only fire in
  # Release mode (e.g. C4701 uninitialized variable).  No test run needed here;
  # correctness is verified by the Debug job above.
  build-windows-release:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        lfs: false

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2.2.0

    - name: Configure project (Release, examples off — no SDL2 on Windows CI)
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOSH_BUILD_EXAMPLES=OFF

    - name: Build project (Release)
      run: cmake --build build --config Release --parallel
