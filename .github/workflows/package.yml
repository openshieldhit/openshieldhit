name: Package and Release

on:
  push:
    branches: [ main ]           # Build packages on main branch commits
  release:
    types: [ published ]         # Upload packages when release is published on GitHub web
  workflow_dispatch:             # Allow manual triggering from Actions UI

permissions:
  contents: read

jobs:
  # Build DEB and TGZ packages on Linux
  package-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Full git history needed for version extraction (git describe)
        lfs: false

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2.2.0

    - name: Configure project (Release)
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build project
      run: cmake --build build --parallel

    - name: Create packages
      run: cmake --build build --target package

    - name: List generated packages
      run: ls -lh build/ | grep -E '\.(deb|tar\.gz)$'

    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: openshieldhit-packages-linux
        path: |
          build/*.deb
          build/*.tar.gz
        retention-days: 3

  # Build TGZ package on macOS
  package-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        lfs: false

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2.2.0

    - name: Configure project (Release)
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build project
      run: cmake --build build --parallel

    - name: Create packages
      run: cmake --build build --target package

    - name: List generated packages
      run: ls -lh build/ | grep -E '\.tar\.gz$'

    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: openshieldhit-packages-macos
        path: build/*.tar.gz
        retention-days: 3

  # Build ZIP package on Windows
  package-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        lfs: false

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2.2.0

    - name: Configure project (Release)
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build project
      run: cmake --build build --config Release --parallel

    - name: Create packages
      run: cmake --build build --config Release --target package

    - name: List generated packages
      run: Get-ChildItem build/ -Filter "*.zip"

    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: openshieldhit-packages-windows
        path: build/*.zip
        retention-days: 3

  # Upload all packages to GitHub release (only runs on release events)
  upload-to-release:
    needs: [package-linux, package-macos, package-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
    - name: Download all package artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: openshieldhit-packages-*
        path: artifacts
        merge-multiple: true

    - name: Upload packages to release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          artifacts/**/*.deb
          artifacts/**/*.tar.gz
          artifacts/**/*.zip

  # Install and verify DEB package works correctly
  test-package:
    needs: package-linux
    runs-on: ubuntu-latest

    steps:
    - name: Download package artifact
      uses: actions/download-artifact@v8
      with:
        name: openshieldhit-packages-linux

    - name: Install DEB package
      run: |
        DEB_FILE=$(find . -name "*.deb" | head -n1)
        echo "Installing ${DEB_FILE}..."
        sudo apt-get update
        sudo apt-get install -y "${DEB_FILE}"

    - name: Test installed executable
      run: |
        openshieldhit --version
        openshieldhit --help

    - name: Verify installed files
      run: |
        dpkg -L openshieldhit | head -20
