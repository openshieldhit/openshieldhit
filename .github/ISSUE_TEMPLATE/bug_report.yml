name: Bug Report
description: Something is not working correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.
        Please fill in as much detail as possible so the issue can be reproduced and fixed.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands and/or input files needed to trigger the bug.
      placeholder: |
        1. Build with `cmake --preset debug && cmake --build --preset debug --parallel`
        2. Run `build_debug/bin/openshieldhit tests/cases/00_minimal/`
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include error messages, assertions, or wrong output values.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: compiler
    attributes:
      label: Compiler and version
      description: "`gcc --version` / `clang --version` / MSVC version"
      placeholder: "e.g. gcc 13.2.0"
    validations:
      required: true

  - type: input
    id: cmake_version
    attributes:
      label: CMake version
      description: "`cmake --version`"
      placeholder: "e.g. 3.28.1"
    validations:
      required: false

  - type: dropdown
    id: preset
    attributes:
      label: Build preset
      description: Which CMake preset was used?
      options:
        - debug
        - release
        - asan
        - relwithdebinfo
        - prof
        - other / custom
    validations:
      required: false

  - type: textarea
    id: input_files
    attributes:
      label: Input files
      description: >
        Paste the relevant input files (`beam.dat`, `geo.dat`, `mat.dat`,
        `detect.dat`) or attach a minimal case directory.
        If the bug is reproducible with an existing test case under
        `tests/cases/`, just name it.
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help — stack traces, sanitizer output, links to related issues, etc.
    validations:
      required: false
