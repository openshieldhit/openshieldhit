[jeff]
dir = "_temp/JEFF40-Processed-PENDF0K"

[grid]
# Irregular grid: 3 points/decade from 1 meV to 1 MeV (thermal + resonance region),
# then 2 points/decade from 1 to 20 MeV (fast neutrons; cross sections smooth above ~1 MeV).
# Upper limit 20 MeV matches the JEFF-4.0 evaluation range for light nuclei; above 20 MeV
# the Tripathi optical fallback is used in the transport code.
# Lower limit 1 meV covers the full 1/v slope of B-10(n,α) and Li-6(n,α) needed for
# BNCT dose and 6LiF/7LiF detector response.  The transport cutoff is currently 1 keV;
# the sub-keV portion of this table is reserved for future thermal neutron transport.
egrid_mev = [
    # thermal + resonance: 3 points/decade (10^(1/3) ≈ 2.154 spacing)
    1.000e-9, 2.154e-9, 4.642e-9,   # 1–10 meV
    1.000e-8, 2.154e-8, 4.642e-8,   # 10–100 meV
    1.000e-7, 2.154e-7, 4.642e-7,   # 0.1–1 eV
    1.000e-6, 2.154e-6, 4.642e-6,   # 1–10 eV
    1.000e-5, 2.154e-5, 4.642e-5,   # 10–100 eV
    1.000e-4, 2.154e-4, 4.642e-4,   # 100 eV – 1 keV
    1.000e-3, 2.154e-3, 4.642e-3,   # 1–10 keV      (transport cutoff is at 1 keV)
    1.000e-2, 2.154e-2, 4.642e-2,   # 10–100 keV
    1.000e-1, 2.154e-1, 4.642e-1,   # 0.1–1 MeV
    1.000e+0,                        # 1 MeV
    # fast: 2 points/decade (10^(1/2) ≈ 3.162 spacing)
    3.162e+0, 1.000e+1, 2.000e+1,   # 1–20 MeV
]

[output]
file = "src/physics/neutron/osh_neutron_xsec_data.h"

[nuclides]
list = [
    "H-1",    # water, tissue, dominant elastic target
    "H-2",    # light water, 2.2 MeV capture line
    "He-3",   # He-3 proportional counter
    "Li-6",   # LiF TLD (6Li-enriched), CLYC detector
    "Li-7",   # LiF TLD (nat/7Li), Li-glass
    "Be-9",   # beam line window
    "B-10",   # BF3 detector, borated polyethylene
    "B-11",   # boron shielding
    "C-12",   # tissue, carbon target, graphite
    "N-14",   # tissue, air
    "O-16",   # water, tissue, air
    "F-19",   # fluoride compounds
    "Na-23",  # soft tissue (ICRP)
    "Mg-24",  # bone mineral
    "Al-27",  # structural aluminium
    "Si-28",  # silicon detector
    "P-31",   # bone mineral
    "S-32",   # soft tissue (ICRP)
    "Cl-35",  # soft tissue (ICRP)
    "Ar-40",  # air
    "K-39",   # soft tissue (ICRP)
    "Ca-40",  # bone mineral
    "Fe-56",  # iron / steel shielding
    "Cu-63",  # copper nozzle, coils; brass
    "Zn-64",  # brass (48.6% of nat Zn)
    "Zn-66",  # brass (27.9% of nat Zn)
    "Zn-68",  # brass (18.8% of nat Zn)
    "Cd-113", # neutron foil cadmium cover; thermal absorber
    "Cd-114", # neutron foil; most abundant Cd isotope (28.7%)
    "W-182",  # collimator (26.5% of nat W)
    "W-183",  # collimator (14.3% of nat W)
    "W-184",  # collimator (30.6% of nat W)
    "W-186",  # collimator (28.4% of nat W)
    "Au-197", # activation foil; monoisotopic
    "Pb-208", # lead shielding
]
