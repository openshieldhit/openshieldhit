site_name: OpenShieldHIT
site_description: Open-source Monte Carlo particle transport code for shielding and therapy physics
site_url: https://nbassler.github.io/openshieldhit
repo_url: https://github.com/nbassler/openshieldhit
repo_name: nbassler/openshieldhit
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide:
    - Getting started: user/getting-started.md
    - Input files overview: user/input-files.md
    - beam.dat reference: user/beam.dat.md
    - geo.dat reference: user/geo.dat.md
    - mat.dat reference: user/mat.dat.md
    - detect.dat reference: user/detect.dat.md
  - Physics Reference:
    - Nuclear inelastic reactions: physics/nuclear-inelastic.md
    - Neutron transport: physics/neutron-transport.md
    - Neutron cross sections: physics/neutron-cross-sections.md
  - Developer Guide:
    - Architecture: dev/architecture.md
    - Build system: dev/build.md
    - Contributing: dev/contributing.md
    - Testing: dev/testing.md
    - Coordinate systems: dev/coordinates.md
    - Random numbers: dev/random_numbers.md
    - Scoring: dev/scoring.md
    - Bug hunts:
      - Overview: dev/bug-hunts/index.md
      - "2026-07-05: Deep audit": dev/bug-hunts/2026-07-05-deep-audit.md
  - API Reference: api/index.html
