          - "Set 01: First simulation": teaching/courses/00-getting-started/exercises/set-01-first-simulation.md
          - "Set 02: Input files": teaching/courses/00-getting-started/exercises/set-02-input-files.md
          - "Set 03: Scoring and plots": teaching/courses/00-getting-started/exercises/set-03-scoring-and-plots.md
      - "01: Basic Monte Carlo transport":
        - Overview: teaching/courses/01-basic-monte-carlo-transport/index.md
        - Slides: teaching/courses/01-basic-monte-carlo-transport/slides/index.md
