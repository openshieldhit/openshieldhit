site_name: OpenShieldHIT
site_description: Open-source Monte Carlo particle transport code for shielding and therapy physics
site_url: https://nbassler.github.io/openshieldhit
repo_url: https://github.com/nbassler/openshieldhit
repo_name: nbassler/openshieldhit
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide:
    - Getting started: user/getting-started.md
    - Input files overview: user/input-files.md
    - beam.dat reference: user/beam.dat.md
    - geo.dat reference: user/geo.dat.md
    - mat.dat reference: user/mat.dat.md
    - detect.dat reference: user/detect.dat.md
  - Physics Reference:
    - Nuclear inelastic reactions: physics/nuclear-inelastic.md
    - Neutron transport: physics/neutron-transport.md
    - Neutron cross sections: physics/neutron-cross-sections.md
  - Teaching:
    - Overview: teaching/index.md
    - Shared slides: teaching/slides/index.md
    - Group projects (PBL): teaching/projects/index.md
    - Courses:
      - Overview: teaching/courses/index.md
